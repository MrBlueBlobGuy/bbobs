[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b8085"
version = "0.1.0"
description = "Modular Intel 8085 emulator with Tkinter UI and serial I/O"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["b8085*"]

